				<div class="social-links" style="justify-content: center">

		<script>
			// Loading animation
			document.addEventListener("DOMContentLoaded", function () {
				const loadingContainer = document.getElementById("loading-container");
				const letters = ["letter-a", "letter-m", "letter-k"];
				let currentLetter = 0;

				function fillNextLetter() {
					if (currentLetter < letters.length) {
						document
							.getElementById(letters[currentLetter])
							.classList.add("filled");
						currentLetter++;
						setTimeout(fillNextLetter, 300);
					} else {
						setTimeout(() => {
							loadingContainer.classList.add("fade-out");
						}, 500);
					}
				}

				// Start the animation
				setTimeout(fillNextLetter, 300);

				// Update loading screen for night mode
				const html = document.documentElement;
				if (html.classList.contains("night-mode")) {
					loadingContainer.classList.add("night-mode");
				}
			});

			// Night mode toggle
			(function () {
				const html = document.documentElement;
				const toggle = document.getElementById("night-mode-toggle");
				const icon = document.getElementById("night-mode-icon");
				const loadingContainer = document.getElementById("loading-container");

				function setNightMode(on) {
					html.classList.toggle("night-mode", on);
					icon.textContent = on ? "☀️" : "🌙";
					loadingContainer.classList.toggle("night-mode", on);
					localStorage.setItem("nightMode", on ? "1" : "0");
				}
				const nightPref = localStorage.getItem("nightMode") === "1";
				setNightMode(nightPref);
				if (toggle)
					toggle.onclick = () =>
						setNightMode(!html.classList.contains("night-mode"));
			})();
		</script>
		<script type="module">
			import { createNav, initNightMode } from "./static/components/nav.js";

			// Add navigation to the page
			document.getElementById("nav-container").appendChild(createNav());

			// Initialize night mode
			initNightMode();
		</script>
	</body>
</html>
